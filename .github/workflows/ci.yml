name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  c-library:
    name: C library (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libxml2-dev libzstd-dev bison flex locales

      # The gateway tests (tests/mex) prove that the numeric locale of the process does not
      # matter; they fail without an installed locale that has a decimal comma.
      - name: Generate a locale with a decimal comma
        run: |
          sudo locale-gen de_DE.UTF-8
          locale -a | grep -i -x 'de_DE\.utf-\?8'

      - name: Cache pinned libiio v1
        uses: actions/cache@v4
        with:
          path: deps/install
          key: libiio-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('deps/build-libiio.sh') }}

      - name: Build pinned libiio v1
        run: deps/build-libiio.sh

      - name: Show CPU
        run: lscpu | grep -i -E 'model name|^flags|^features' | cut -c1-600

      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja -DIIO_CONV_STRICT_TESTS=ON
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: Build and test with sanitizers
        run: |
          cmake -S . -B build-asan -G Ninja -DIIO_CONV_SANITIZE=ON -DIIO_CONV_STRICT_TESTS=ON
          cmake --build build-asan
          ctest --test-dir build-asan --output-on-failure

      - name: Test with each backend forced
        run: |
          for be in scalar sse41 avx2 avx512 neon; do
            echo "::group::IIO_CONV_FORCE=$be"
            IIO_CONV_FORCE=$be ctest --test-dir build --output-on-failure
            echo "::endgroup::"
          done

      - name: Build and test with FMA available (x86-64-v3)
        if: runner.arch == 'X64'
        run: |
          cmake -S . -B build-fma -G Ninja -DCMAKE_C_FLAGS=-march=x86-64-v3 -DIIO_CONV_SANITIZE=ON -DIIO_CONV_STRICT_TESTS=ON
          cmake --build build-fma
          ctest --test-dir build-fma --output-on-failure

      - name: Release build, tests and a short benchmark
        run: |
          cmake -S . -B build-rel -G Ninja -DCMAKE_BUILD_TYPE=Release -DIIO_CONV_BUILD_BENCH=ON -DIIO_CONV_STRICT_TESTS=ON
          cmake --build build-rel
          ctest --test-dir build-rel --output-on-failure
          build-rel/bench/bench_conv -n 12 tests/resources/conv_test.xml

      - name: Hardware timing checker self-test (no hardware)
        run: python3 bench/hw-stream/test_check_results.py

  matlab:
    name: MATLAB bindings (${{ matrix.release }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        release: [R2025b, R2023b]
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libxml2-dev libzstd-dev bison flex locales

      # The gateway tests (tests/mex) prove that the numeric locale of the process does not
      # matter; they fail without an installed locale that has a decimal comma.
      - name: Generate a locale with a decimal comma
        run: |
          sudo locale-gen de_DE.UTF-8
          locale -a | grep -i -x 'de_DE\.utf-\?8'

      - name: Cache pinned libiio v1
        uses: actions/cache@v4
        with:
          path: deps/install
          key: libiio-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('deps/build-libiio.sh') }}

      - name: Build pinned libiio v1
        run: deps/build-libiio.sh

      - name: Set up MATLAB
        id: setup-matlab
        uses: matlab-actions/setup-matlab@v2
        with:
          release: ${{ matrix.release }}
          cache: true

      - name: Locate MATLAB
        run: |
          root="${{ steps.setup-matlab.outputs.matlabroot }}"
          [ -n "$root" ] || root=$(dirname "$(dirname "$(readlink -f "$(command -v matlab)")")")
          test -f "$root/extern/include/mex.h"
          test -x "$root/bin/glnxa64/mlint" || echo "::warning::no mlint in $root: the test mex_mlint will exit 77 (see matlab/tools/check_mlint.sh)"
          echo "MATLAB_ROOT=$root" >> "$GITHUB_ENV"

      # IIO_CONV_MEX_TEST_HOOKS=ON: the MEX file the MATLAB tests use has the test_* commands
      # (the scripted backend). The ctest step below checks that they are in (mex_test_hooks).
      - name: Configure and build (mock tests with sanitizers, real MEX with the test hooks)
        run: |
          cmake -S . -B build-mex -G Ninja -DIIO_CONV_BUILD_MATLAB=ON -DIIO_CONV_MEX_TEST_HOOKS=ON \
            -DIIO_CONV_STRICT_TESTS=ON -DMatlab_ROOT_DIR="$MATLAB_ROOT"
          cmake --build build-mex

      - name: Gateway checks without MATLAB (G1 to G4)
        run: ctest --test-dir build-mex -L mex --output-on-failure

      # The MEX file as it is handed out: the build of matlab/README.md with its default options
      # (IIO_CONV_MEX_TEST_HOOKS is not given) has no test_* commands and no fake backend.
      # Only the MEX file and the checks of the file itself are built and run here; the mock
      # tests ran above. Its own output directory: matlab/iio_mex.mexa64 above is the one the
      # MATLAB tests use. IIO_CONV_STRICT_TESTS=ON adds -Werror to the gateway: this variant has
      # code paths of its own (no IIO_MEX_TEST_HOOKS). All three checks must have run. Then the
      # configuration without any test (IIO_CONV_BUILD_TESTS=OFF) builds whole.
      - name: Default MEX build has no test hooks
        run: |
          cmake -S . -B build-mex-dist -G Ninja -DIIO_CONV_BUILD_MATLAB=ON -DIIO_CONV_STRICT_TESTS=ON \
            -DMatlab_ROOT_DIR="$MATLAB_ROOT" -DIIO_MEX_OUTPUT_DIR="$PWD/build-mex-dist/out"
          cmake --build build-mex-dist --target iio_mex mex_loadcheck
          test -f build-mex-dist/out/iio_mex.mexa64
          ctest --test-dir build-mex-dist -R '^(mex_test_hooks|mex_exports|mex_loadcheck)$' \
            --no-tests=error --output-on-failure | tee build-mex-dist/ctest.log
          grep -q '100% tests passed, 0 tests failed out of 3' build-mex-dist/ctest.log
          if strings build-mex-dist/out/iio_mex.mexa64 | grep -q -E 'test_create_fake|test_fake_'; then
            echo "the test commands are in the MEX file"; exit 1
          fi
          cmake -S . -B build-mex-notests -G Ninja -DIIO_CONV_BUILD_MATLAB=ON -DIIO_CONV_BUILD_TESTS=OFF \
            -DIIO_CONV_STRICT_TESTS=ON -DMatlab_ROOT_DIR="$MATLAB_ROOT" \
            -DIIO_MEX_OUTPUT_DIR="$PWD/build-mex-notests/out"
          cmake --build build-mex-notests
          matlab/tools/check_mex_hooks.sh build-mex-notests/out/iio_mex.mexa64 without

      - name: Prepare the result folder
        run: mkdir -p test-results

      - name: MATLAB tests (G5)
        uses: matlab-actions/run-tests@v2
        env:
          IIO_MEX_TRACE: ${{ github.workspace }}/test-results/iio-mex-trace.log
          IIO_TEST_RESULTS: ${{ github.workspace }}/test-results
        with:
          source-folder: matlab
          select-by-folder: matlab/tests
          test-results-junit: test-results/matlab.xml
          strict: true
          startup-options: -logfile test-results/matlab.log

      - name: Process exit with libiio loaded (run 1 of 10)
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('matlab'); c = iio.Context(['emu:' fullfile(pwd, 'tests', 'resources', 'iio_fixture.xml')]); a = c.find_attr('hw_model'); disp(a.read()); p = matlab.io.xml.dom.Parser; exit

      - name: Process exit with libiio loaded (run 2 of 10)
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('matlab'); c = iio.Context(['emu:' fullfile(pwd, 'tests', 'resources', 'iio_fixture.xml')]); a = c.find_attr('hw_model'); disp(a.read()); p = matlab.io.xml.dom.Parser; exit

      - name: Process exit with libiio loaded (run 3 of 10)
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('matlab'); c = iio.Context(['emu:' fullfile(pwd, 'tests', 'resources', 'iio_fixture.xml')]); a = c.find_attr('hw_model'); disp(a.read()); p = matlab.io.xml.dom.Parser; exit

      - name: Process exit with libiio loaded (run 4 of 10)
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('matlab'); c = iio.Context(['emu:' fullfile(pwd, 'tests', 'resources', 'iio_fixture.xml')]); a = c.find_attr('hw_model'); disp(a.read()); p = matlab.io.xml.dom.Parser; exit

      - name: Process exit with libiio loaded (run 5 of 10)
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('matlab'); c = iio.Context(['emu:' fullfile(pwd, 'tests', 'resources', 'iio_fixture.xml')]); a = c.find_attr('hw_model'); disp(a.read()); p = matlab.io.xml.dom.Parser; exit

      - name: Process exit with libiio loaded (run 6 of 10)
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('matlab'); c = iio.Context(['emu:' fullfile(pwd, 'tests', 'resources', 'iio_fixture.xml')]); a = c.find_attr('hw_model'); disp(a.read()); p = matlab.io.xml.dom.Parser; exit

      - name: Process exit with libiio loaded (run 7 of 10)
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('matlab'); c = iio.Context(['emu:' fullfile(pwd, 'tests', 'resources', 'iio_fixture.xml')]); a = c.find_attr('hw_model'); disp(a.read()); p = matlab.io.xml.dom.Parser; exit

      - name: Process exit with libiio loaded (run 8 of 10)
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('matlab'); c = iio.Context(['emu:' fullfile(pwd, 'tests', 'resources', 'iio_fixture.xml')]); a = c.find_attr('hw_model'); disp(a.read()); p = matlab.io.xml.dom.Parser; exit

      - name: Process exit with libiio loaded (run 9 of 10)
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('matlab'); c = iio.Context(['emu:' fullfile(pwd, 'tests', 'resources', 'iio_fixture.xml')]); a = c.find_attr('hw_model'); disp(a.read()); p = matlab.io.xml.dom.Parser; exit

      - name: Process exit with libiio loaded (run 10 of 10)
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('matlab'); c = iio.Context(['emu:' fullfile(pwd, 'tests', 'resources', 'iio_fixture.xml')]); a = c.find_attr('hw_model'); disp(a.read()); p = matlab.io.xml.dom.Parser; exit

      - name: No crash dump after the exit checks
        run: |
          if ls ~/matlab_crash_dump.* >/dev/null 2>&1; then echo "exit check: crash dump found"; exit 1; fi

      # A green test step says only that no test failed. This also fails the job when tests
      # did not run (fewer than the minimum), were skipped, or took 4.9 s or more (tTiming is
      # exempt): the stall of the emu backend that this looks for is 5 s, and a test that
      # pays for a cold start of MATLAB on a shared runner must not reach the limit. The
      # step comes after the exit checks, so that a slow test does not skip them. The minimum
      # is the number of test methods rounded down to a multiple of 10 (242: 238 after wave 2b
      # and the 4 of the API decisions: scanEmptyBackendsIsDefault and
      # scanEmptyBackendsSendsNoList of tTopLevel, timeoutConstants of tRxStream and of
      # tTxStream); raise it when the suite grows.
      - name: Check the MATLAB test results (count, skipped, duration)
        if: always()
        run: python3 matlab/tools/check_junit.py test-results/matlab.xml --min-tests 240 --max-seconds 4.9 --max-skipped 0

      - name: Collect crash dumps
        if: always()
        run: mkdir -p test-results && cp ~/matlab_crash_dump.* test-results/ 2>/dev/null || true

      - name: Upload MATLAB test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-${{ matrix.release }}
          path: test-results/

      # Written by tTiming; absent when that test did not run. The CPU is that of this job's
      # runner (the job c-library runs on another machine).
      - name: Timing summary
        if: always()
        run: |
          if [ -f test-results/timing.txt ]; then
            {
              echo '### MATLAB fast path timing (${{ matrix.release }})'
              echo
              echo '```'
              cat test-results/timing.txt
              echo '```'
              echo
              echo "Runner CPU: $(lscpu | grep -i -m1 'model name' | sed 's/^[^:]*: *//')"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
